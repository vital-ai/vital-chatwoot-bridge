# A route file for multi-account mode (CW_BRIDGE__chatwoot__account_mode=multi): one per application, naming its
# Chatwoot account and which agent handles each of its inboxes. Point CW_BRIDGE__routing__files at the file or its
# directory. POST /api/v1/routes/reload reads the files again; a file that doesn't validate is refused, and the routes
# already loaded stay. Pausing an inbox (POST /api/v1/routes/{account}/{inbox}/pause) is separate: a reload never
# resumes it.
app: example                         # a name for logs, status and delivery reports
chatwoot_account_id: 3               # one application per account; needs CW_BRIDGE__chatwoot__accounts__3__token
bot: example-bot                     # optional: a bot in CW_BRIDGE__bots__ whose token signs this account's webhooks
agent_auth:                          # optional: the token this app's agents expect, sent inside each AIMP message
  token_url: https://keycloak.example.com/realms/example/protocol/openid-connect/token
  client_id: chatwoot-bridge
  client_secret_env: EXAMPLE_AGENT_CLIENT_SECRET   # the environment variable holding its secret; a file without it is refused
inboxes:
  - inbox_id: 12
    name: support-email
    retries: 2                       # extra attempts to hand a message to the agent before reporting it failed
    agent:
      agent_id: support-agent
      websocket_url: ws://support-agent:8080/ws
      timeout_seconds: 120
  - inbox_id: 13
    name: contact-form               # an API inbox: it has no channel back to the contact, so with from_email each public
    from_email: support@example.com  # reply is also emailed to the contact (once; needs CW_BRIDGE__mailgun__*)
    reply_subject: Your message to support    # optional; the default names the inbox
    agent:
      agent_id: support-agent
      websocket_url: ws://support-agent:8080/ws
